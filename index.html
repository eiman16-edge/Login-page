<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth Screens</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="auth-card">
      <!-- Form Switching Tabs -->
      <div class="auth-tabs">
        <button class="tab-btn active" onclick="switchForm('login')">
          Login
        </button>
        <button class="tab-btn" onclick="switchForm('register')">
          Register
        </button>
      </div>

      <!-- ================= LOGIN FORM ================= -->
      <form id="loginForm" class="auth-form" onsubmit="handleSubmit(event)">
        <h2>Welcome Back</h2>

        <div class="input-group">
          <label for="loginEmail">Email</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="input-group">
          <label for="loginPassword">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="loginPassword"
              placeholder="Enter your password"
              required
            />
            <button
              type="button"
              class="toggle-password"
              onclick="togglePass('loginPassword')"
            >
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>
      </form>

      <!-- ================= REGISTER FORM ================= -->
      <form
        id="registerForm"
        class="auth-form hidden"
        onsubmit="handleSubmit(event)"
      >
        <h2>Create Account</h2>

        <div class="input-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" placeholder="name@example.com" />
          <span class="error-msg" id="emailError"
            >Please enter a valid email address.</span
          >
        </div>

        <div class="input-group">
          <label for="regPassword">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="regPassword"
              placeholder="At least 6 characters"
            />
            <button
              type="button"
              class="toggle-password"
              onclick="togglePass('regPassword')"
            >
              👁️
            </button>
          </div>
          <span class="error-msg" id="passError"
            >Password must be at least 6 characters long.</span
          >
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Repeat your password"
            />
            <button
              type="button"
              class="toggle-password"
              onclick="togglePass('confirmPassword')"
            >
              👁️
            </button>
          </div>
          <span class="error-msg" id="confirmError"
            >Passwords do not match.</span
          >
        </div>

        <button type="submit" class="submit-btn">Register</button>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
